name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (backend, frontend, shared contract)
        run: npm run typecheck
      - name: Tests (backend, PGlite in memory, AI mocked)
        run: npm test
      - name: Build
        run: npm run build
